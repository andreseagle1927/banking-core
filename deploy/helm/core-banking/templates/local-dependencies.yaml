{{- if .Values.localDependencies.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-init-databases.sql: |
{{ .Files.Get "files/init-databases.sql" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-import
data:
  realm-core-banking.json: |
{{ .Files.Get "files/realm-core-banking.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-bootstrap
data:
  bootstrap-realm.sh: |
{{ .Files.Get "files/bootstrap-realm.sh" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.localDependencies.postgres.image | quote }}
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: postgres }
            - { name: POSTGRES_USER, value: postgres }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.existingSecretName }}, key: postgres-admin-password }
          startupProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"] }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"] }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.localDependencies.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.localDependencies.postgres.storage }} }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: kafka }
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
    - { name: controller, port: 9093, targetPort: controller }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: kafka }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: kafka }
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: kafka
          image: {{ .Values.localDependencies.kafka.image | quote }}
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: CLUSTER_ID, value: "4L6g3nShT-eMCtK--X86sw" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "INTERNAL://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "INTERNAL" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data/kafka-logs" }
          startupProbe:
            exec: { command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"] }
            periodSeconds: 5
            timeoutSeconds: 8
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"] }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"] }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 8
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.localDependencies.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.localDependencies.kafka.storage }} }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: keycloak }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-data
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.localDependencies.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests: { storage: {{ .Values.localDependencies.keycloak.storage }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: keycloak }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: keycloak }
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: keycloak
          image: {{ .Values.localDependencies.keycloak.image | quote }}
          command: ["/bin/sh", "-c"]
          args: ["mkdir -p /opt/keycloak/data/import && cp /opt/keycloak/import-files/realm-core-banking.json /opt/keycloak/data/import/realm-core-banking.json && exec /opt/keycloak/bin/kc.sh start-dev --import-realm"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.existingSecretName }}, key: keycloak-admin-password }
            - { name: KC_HOSTNAME, value: {{ .Values.localDependencies.keycloak.hostname | quote }} }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
          startupProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - { name: keycloak-data, mountPath: /opt/keycloak/data }
            - { name: realm, mountPath: /opt/keycloak/import-files/realm-core-banking.json, subPath: realm-core-banking.json, readOnly: true }
      volumes:
        - name: keycloak-data
          persistentVolumeClaim: { claimName: keycloak-data }
        - name: realm
          configMap: { name: keycloak-import }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-bootstrap-r{{ .Release.Revision }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: {{ .Values.localDependencies.keycloak.image | quote }}
          command: ["/bin/sh", "/bootstrap-realm.sh"]
          env:
            - { name: KEYCLOAK_ADMIN_URL, value: "http://keycloak:8080" }
            - { name: KEYCLOAK_ADMIN, value: admin }
            - { name: KEYCLOAK_REALM, value: core-banking }
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.existingSecretName }}, key: keycloak-admin-password }
            - name: TRANSFER_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.existingSecretName }}, key: transfer-client-secret }
            - name: WALLET_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.existingSecretName }}, key: wallet-client-secret }
            - name: LOAN_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.existingSecretName }}, key: loan-client-secret }
            - name: NOTIFICATION_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.existingSecretName }}, key: notification-client-secret }
          volumeMounts:
            - { name: script, mountPath: /bootstrap-realm.sh, subPath: bootstrap-realm.sh, readOnly: true }
      volumes:
        - name: script
          configMap: { name: keycloak-bootstrap }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: web, port: 8025, targetPort: web }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mailpit }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mailpit }
    spec:
      containers:
        - name: mailpit
          image: {{ .Values.localDependencies.mailpit.image | quote }}
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: web, containerPort: 8025 }
          readinessProbe:
            httpGet: { path: /api/v1/info, port: web }
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
{{- end }}
