# Provider-neutral production shape. Supply real image references, endpoints and Secret.
global:
  imagePullPolicy: IfNotPresent
  auth:
    issuerUri: https://identity.example.com/realms/core-banking
    jwkSetUri: https://identity.example.com/realms/core-banking/protocol/openid-connect/certs
    tokenUri: https://identity.example.com/realms/core-banking/protocol/openid-connect/token

secrets:
  create: false
  existingSecretName: core-banking-secrets

gatewayIngress:
  enabled: true
  className: nginx
  host: banking.example.com
  tls:
    - secretName: banking-tls
      hosts: [banking.example.com]

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

localDependencies:
  enabled: false

services:
  api-gateway:
    image: registry.example.com/core-banking/api-gateway:REPLACE_ME
    replicas: 2
    env:
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      WALLET_SERVICE_URL: http://wallet-service:8083
      TRANSFER_SERVICE_URL: http://transfer-service:8084
      LOAN_SERVICE_URL: http://loan-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
  customer-service:
    image: registry.example.com/core-banking/customer-service:REPLACE_ME
    replicas: 2
    env:
      DB_URL: jdbc:postgresql://customer-db.example.com:5432/customer_db?sslmode=require
      DB_USERNAME: customer_user
    secretEnv: [{ name: DB_PASSWORD, key: customer-db-password }]
  wallet-service:
    image: registry.example.com/core-banking/wallet-service:REPLACE_ME
    replicas: 2
    env:
      DB_URL: jdbc:postgresql://wallet-db.example.com:5432/wallet_db?sslmode=require
      DB_USERNAME: wallet_user
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      LEDGER_URL: http://ledger-service:8085
      LEDGER_CLIENT_ID: wallet-service
    secretEnv:
      - { name: DB_PASSWORD, key: wallet-db-password }
      - { name: LEDGER_CLIENT_SECRET, key: wallet-client-secret }
  transfer-service:
    image: registry.example.com/core-banking/transfer-service:REPLACE_ME
    replicas: 2
    env:
      DB_URL: jdbc:postgresql://transfer-db.example.com:5432/transfer_db?sslmode=require
      DB_USERNAME: transfer_user
      LEDGER_URL: http://ledger-service:8085
      LEDGER_CLIENT_ID: transfer-service
      KAFKA_BOOTSTRAP_SERVERS: kafka.example.com:9094
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-512
    secretEnv:
      - { name: DB_PASSWORD, key: transfer-db-password }
      - { name: LEDGER_CLIENT_SECRET, key: transfer-client-secret }
      - { name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG, key: kafka-sasl-jaas-config }
  ledger-service:
    image: registry.example.com/core-banking/ledger-service:REPLACE_ME
    replicas: 2
    env:
      DB_URL: jdbc:postgresql://ledger-db.example.com:5432/ledger_db?sslmode=require
      DB_USERNAME: ledger_user
    secretEnv: [{ name: DB_PASSWORD, key: ledger-db-password }]
  loan-service:
    image: registry.example.com/core-banking/loan-service:REPLACE_ME
    replicas: 2
    env:
      DB_URL: jdbc:postgresql://loan-db.example.com:5432/loan_db?sslmode=require
      DB_USERNAME: loan_user
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      LEDGER_URL: http://ledger-service:8085
      LOAN_CLIENT_ID: loan-service
    secretEnv:
      - { name: DB_PASSWORD, key: loan-db-password }
      - { name: LOAN_CLIENT_SECRET, key: loan-client-secret }
  notification-service:
    image: registry.example.com/core-banking/notification-service:REPLACE_ME
    replicas: 2
    env:
      DB_URL: jdbc:postgresql://notification-db.example.com:5432/notification_db?sslmode=require
      DB_USERNAME: notification_user
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "587"
      NOTIFICATION_FROM: no-reply@banking.example.com
      SMTP_AUTH: "true"
      SMTP_STARTTLS: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka.example.com:9094
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-512
      NOTIFICATION_CLIENT_ID: notification-service
    secretEnv:
      - { name: DB_PASSWORD, key: notification-db-password }
      - { name: NOTIFICATION_CLIENT_SECRET, key: notification-client-secret }
      - { name: SMTP_USERNAME, key: smtp-username }
      - { name: SMTP_PASSWORD, key: smtp-password }
      - { name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG, key: kafka-sasl-jaas-config }
