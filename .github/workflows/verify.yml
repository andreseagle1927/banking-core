name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  maven-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run reactor tests and package applications
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: warn

  container-build:
    name: Container build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            module: gateway/api-gateway
          - name: customer-service
            module: services/customer-service
          - name: wallet-service
            module: services/wallet-service
          - name: transfer-service
            module: services/transfer-service
          - name: ledger-service
            module: services/ledger-service
          - name: loan-service
            module: services/loan-service
          - name: notification-service
            module: services/notification-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build container image (no push)
        run: >-
          docker build --pull
          --build-arg MODULE=${{ matrix.module }}
          --tag core-banking/${{ matrix.name }}:ci-${{ github.sha }}
          .
