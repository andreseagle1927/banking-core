name: core-banking
x-auth-env: &auth-env
  KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/core-banking
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/core-banking/protocol/openid-connect/certs
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_postgres
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: "1"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports: ["29092:29092"]
    volumes: ["kafka_tmp:/tmp"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8081:8080"]
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infrastructure/keycloak/realm-core-banking.json:/opt/keycloak/data/import/realm-core-banking.json:ro
  ledger-service:
    build: { context: ., args: { MODULE: services/ledger-service, APP_PORT: "8085" } }
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
    expose: ["8085"]
    ports: ["8085:8085"]
    environment:
      <<: *auth-env
      DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      DB_USERNAME: ledger_user
      DB_PASSWORD: ledger_local
      SERVER_PORT: 8085
  transfer-service:
    build: { context: ., args: { MODULE: services/transfer-service, APP_PORT: "8084" } }
    environment:
      <<: *auth-env
      DB_URL: jdbc:postgresql://postgres:5432/transfer_db
      DB_USERNAME: transfer_user
      DB_PASSWORD: transfer_local
      LEDGER_URL: http://ledger-service:8085
      LEDGER_CLIENT_ID: transfer-service
      LEDGER_CLIENT_SECRET: transfer-local-secret
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/core-banking/protocol/openid-connect/token
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8084
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
      ledger-service: { condition: service_healthy }
      kafka: { condition: service_healthy }
    expose: ["8084"]
  customer-service:
    build: { context: ., args: { MODULE: services/customer-service, APP_PORT: "8082" } }
    environment:
      <<: *auth-env
      DB_URL: jdbc:postgresql://postgres:5432/customer_db
      DB_USERNAME: customer_user
      DB_PASSWORD: customer_local
      SERVER_PORT: 8082
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
    expose: ["8082"]
  wallet-service:
    build: { context: ., args: { MODULE: services/wallet-service, APP_PORT: "8083" } }
    environment:
      <<: *auth-env
      DB_URL: jdbc:postgresql://postgres:5432/wallet_db
      DB_USERNAME: wallet_user
      DB_PASSWORD: wallet_local
      SERVER_PORT: 8083
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
    expose: ["8083"]
  loan-service:
    build: { context: ., args: { MODULE: services/loan-service, APP_PORT: "8086" } }
    environment:
      <<: *auth-env
      DB_URL: jdbc:postgresql://postgres:5432/loan_db
      DB_USERNAME: loan_user
      DB_PASSWORD: loan_local
      SERVER_PORT: 8086
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
    expose: ["8086"]
  notification-service:
    build: { context: ., args: { MODULE: services/notification-service, APP_PORT: "8087" } }
    environment:
      <<: *auth-env
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: notification_user
      DB_PASSWORD: notification_local
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8087
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
      kafka: { condition: service_healthy }
    expose: ["8087"]
  api-gateway:
    build: { context: ., args: { MODULE: gateway/api-gateway, APP_PORT: "8080" } }
    environment:
      <<: *auth-env
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      WALLET_SERVICE_URL: http://wallet-service:8083
      TRANSFER_SERVICE_URL: http://transfer-service:8084
      LOAN_SERVICE_URL: http://loan-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
    ports: ["8080:8080"]
    depends_on:
      customer-service: { condition: service_healthy }
      wallet-service: { condition: service_healthy }
      transfer-service: { condition: service_healthy }
      loan-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
  kafka_tmp:
  keycloak_data:
